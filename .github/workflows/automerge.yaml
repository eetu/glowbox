name: Automerge

on:
  pull_request:

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Skip github-actions bumps: they edit .github/workflows/*, which GITHUB_TOKEN
    # cannot merge (no `workflows` permission scope) — the run would fail and leave
    # a red X on the PR. Merge those by hand (and review the CI change). Everything
    # else (npm/cargo/pip/uv/docker) automerges on the plain GITHUB_TOKEN.
    if: github.actor == 'dependabot[bot]' && !startsWith(github.head_ref, 'dependabot/github_actions')

    steps:
      # Native GitHub auto-merge: merges once the REQUIRED checks pass — here the
      # `main` ruleset requires "Lint / typecheck / test / build". Replaces the
      # retired house action (eetu/action-automerge, now archived and read-only),
      # which counted a SKIPPED check as still-pending and so polled until its own
      # timeout on any PR that didn't run every job. Required-only means a skipped
      # job can never block the merge.
      - name: Enable auto-merge
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
