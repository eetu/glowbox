name: Release

# Publish @glowbox/* to the public npm registry when a v* tag is pushed.
#
# Tokenless: authenticates via npm trusted publishing (OIDC) and attaches a provenance
# statement — there is NO NPM_TOKEN secret. Each @glowbox/* package needs a trusted
# publisher configured on npm (repo eetu/glowbox, workflow .github/workflows/release.yaml)
# before its first OIDC publish; a brand-new package/scope is bootstrapped either with an
# org-level trusted publisher or one seed publish via a granular token.
#
# Two jobs, so publish rights never meet third-party code: `verify` installs the dev
# dependencies, runs the full suite and packs the tarballs with no way to mint a token;
# `publish` holds the OIDC token and runs nothing but npm on those tarballs.
#
# Monorepo wrinkle: the packages depend on each other via `workspace:^`, which plain
# `npm publish` won't rewrite. So `yarn pack` builds each tarball (resolving `workspace:^`
# to a real range + running the package's prepack), then `npm publish <tarball>` does the
# OIDC auth + provenance.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

env:
  TAG: ${{ github.ref_name }}
  # Enumeration, not discovery: adding a package means adding it here (vfd was missed
  # for 1.9.0 and had to ship by hand). led-grid first, so dependents resolve.
  PACKAGES: led-grid nixie seven-segment flip-dot split-flap neon vfd lcd crt svelte react vue extras

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history (+ origin/main ref) so the tag-on-main check works
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - name: Verify tag is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Verify tag matches every @glowbox/* version
        # Everything publishes in lockstep — a stale version field in ANY package must
        # block the whole release, not publish silently under the wrong tag.
        run: |
          for pkg in $PACKAGES; do
            v="v$(node -p "require('./packages/$pkg/package.json').version")"
            if [ "$v" != "$TAG" ]; then
              echo "@glowbox/$pkg is $v but the tag is $TAG"
              exit 1
            fi
          done
      - name: Validate & build
        run: |
          yarn() { node .yarn/releases/yarn-*.cjs "$@"; }
          yarn install --immutable
          # Gate the publish on the full suite (same checks as CI) — a tag must never ship
          # unvalidated code, and npm publishes are effectively irreversible. Browser (vitest)
          # and e2e (Playwright) tests need chromium.
          ./node_modules/.bin/playwright install --with-deps chromium webkit
          # The gallery e2e runs its workspace's own `@playwright/test`; browser builds are
          # pinned per playwright version, so install for that resolution too.
          yarn workspace @glowbox/svelte-gallery exec playwright install --with-deps chromium
          # The shared/ symlinks are real symlinks, not the text files git-on-Windows
          # would leave behind. Cheap, and first so it fails before anything confusing.
          node scripts/check-shared.mjs
          yarn lint
          yarn format
          # Build before typecheck: cross-package typecheck resolves @glowbox/* through each
          # package's published `dist` types, so core/nixie must be built first.
          yarn build # topological: core → nixie → wrappers → extras (+ demo)
          yarn typecheck
          yarn test
          yarn size
          # Publish-integrity smoke — the packages exactly as npm consumers get them
          # (pack → install → node import → tsc on shipped types → browser mount).
          node scripts/publish-smoke.mjs
      - name: Pack
        run: |
          mkdir -p tarballs
          # Absolute: `yarn workspace` resolves a relative --out from the package's directory.
          for pkg in $PACKAGES; do
            node .yarn/releases/yarn-*.cjs workspace "@glowbox/$pkg" pack --out "$GITHUB_WORKSPACE/tarballs/$pkg.tgz"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tarballs
          path: tarballs/
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # mint the OIDC token npm exchanges for a short-lived publish credential
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .node-version
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: tarballs
          path: tarballs
      - name: Publish
        run: |
          VERSION="${TAG#v}"
          # npm dist-tag: prereleases (1.0.0-rc.1) → `rc`, finals → `latest`.
          if [[ "$VERSION" == *-* ]]; then DIST_TAG=rc; else DIST_TAG=latest; fi
          # The `npm view` guard makes reruns idempotent (npm has no --tolerate-republish;
          # republishing a version is a hard 403).
          for pkg in $PACKAGES; do
            name="@glowbox/$pkg"
            if npm view "$name@$VERSION" version >/dev/null 2>&1; then
              echo "$name@$VERSION already published — skipping"
              continue
            fi
            # Absolute: npm reads a bare `dir/file.tgz` as a GitHub `user/repo` spec.
            npm publish "$GITHUB_WORKSPACE/tarballs/$pkg.tgz" --provenance --access public --tag "$DIST_TAG"
          done
